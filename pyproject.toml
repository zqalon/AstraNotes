[project]
name = "astranotes"
version = "0.1.0"
description = "AstraNotes web app skeleton for note management"
authors = [
    { name = "AstraNotes Team", email = "team@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["notes", "web", "fastapi", "python"]
dependencies = [
    "fastapi>=0.107.0",
    "uvicorn>=0.25.0",
    "sqlmodel>=0.0.8",
    "python-dotenv>=1.0.0",
    "passlib[bcrypt]>=1.7.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://example.com/astranotes"
Repository = "https://github.com/example/astranotes"

[tool.setuptools]
packages = ["astranotes"]

[tool.setuptools.package-dir]
"" = "src"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
