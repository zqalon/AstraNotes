{% extends "base.html" %}

{% block content %}
  <div class="profile-panel">
    <h2>Profile</h2>
    <p>Manage your account information and security settings here.</p>

    <div class="profile-box">
      <div class="profile-row"><span>Username:</span> <strong>{{ user.username if user else 'Guest' }}</strong></div>
      <div class="profile-row"><span>Email:</span> <strong>{{ user.email if user else 'Not signed in' }}</strong></div>
      <div class="profile-row"><span>Status:</span> <strong>{{ 'Active' if user else 'Anonymous' }}</strong></div>
    </div>
  </div>
{% endblock %}
